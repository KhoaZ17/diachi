<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Địa Chỉ Nè</title>
    <style>
        body {
            /* Đặt màu nền cho trang web */
            background-color: #ffffff; 
            display: flex;
            justify-content: center; /* Căn giữa theo chiều ngang */
            align-items: center; /* Căn giữa theo chiều dọc */
            min-height: 100vh; /* Đảm bảo trang web chiếm toàn bộ chiều cao màn hình */
            margin: 0;
        }
        img {
            /* Để hình ảnh hiển thị rõ ràng và không bị biến dạng */
            max-width: 90%; 
            height: auto;
            border: 2px solid #ffffff; /* Thêm đường viền trắng cho hình */
        }
    </style>
</head>
<body>
    <img src="map.png" alt="Bản đồ vệ tinh chỉ đến địa chỉ 36 Hoa Thanh Quế">
</body>
</html>
